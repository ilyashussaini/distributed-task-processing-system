name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Ruff and pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tasks
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: tasks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U tasks -d tasks"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Unit tests
        run: python -m pytest -m 'not integration' -ra
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://tasks:ci-test-password@127.0.0.1:5432/tasks
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: python -m pytest -m integration -ra

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose:
    name: Clean Compose build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build application images from scratch
        run: docker compose build --pull --no-cache
      - name: Start the complete stack
        run: docker compose up -d --no-build --wait --wait-timeout 120 --scale worker=2
      - name: Verify schema and live job processing
        run: |
          docker compose exec -T api alembic check
          python3 tests/compose_smoke.py
          SMOKE_BASE_URL=http://127.0.0.1:3000/api python3 tests/dashboard_smoke.py
          test "$(docker compose ps --status running -q worker | wc -l)" -eq 2
      - name: Exercise timeout and worker-loss recovery
        run: |
          docker compose -f compose.yaml -f compose.recovery.yaml up -d --no-build --wait --wait-timeout 120 --scale worker=2
          python3 tests/recovery_demo.py --project distributed-task-system
      - name: Collect container logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
      - name: Remove the CI stack
        if: always()
        run: docker compose down --volumes
