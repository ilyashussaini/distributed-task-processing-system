# Opt-in scenario settings for the isolated two-worker demo.
services:
  api:
    environment:
      ENABLE_RECOVERY_DEMO: "true"
      MAX_ATTEMPTS: "2"
  worker:
    restart: "no"
    environment:
      ATTEMPT_TIMEOUT_SECONDS: "4"
      LEASE_SECONDS: "2"
      RETRY_BASE_SECONDS: "1"
      POLL_MS: "100"
