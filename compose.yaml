name: distributed-task-system

x-app: &app
  build: .
  init: true
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_USER: ${POSTGRES_USER:-tasks}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    POSTGRES_DB: ${POSTGRES_DB:-tasks}
    REDIS_URL: redis://redis:6379/0
    REDIS_STREAM: ${REDIS_STREAM:-task-system:jobs}
    MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
    ATTEMPT_TIMEOUT_SECONDS: ${ATTEMPT_TIMEOUT_SECONDS:-30}
    ENABLE_RECOVERY_DEMO: ${ENABLE_RECOVERY_DEMO:-false}
    RETRY_BASE_SECONDS: ${RETRY_BASE_SECONDS:-2}
    RETRY_MAX_SECONDS: ${RETRY_MAX_SECONDS:-60}
    LEASE_SECONDS: ${LEASE_SECONDS:-30}
    REDISPATCH_SECONDS: ${REDISPATCH_SECONDS:-15}
    POLL_MS: ${POLL_MS:-500}
    DISPATCH_BATCH_SIZE: ${DISPATCH_BATCH_SIZE:-50}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tasks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/jobs?limit=1', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "task_system.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
